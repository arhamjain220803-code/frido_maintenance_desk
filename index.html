<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frido Maintenance Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style id="app-style">
:root{
  --ground:#F1F5F4; --surface:#FFFFFF; --surface-2:#E8EFEE; --raised:#FFFFFF;
  --line:#D2DEDB; --line-soft:#E3EBEA;
  --ink:#0F1A18; --ink-2:#3C4E4B; --muted:#6A7C79;
  --accent:#0D6E63; --accent-2:#0A574E; --accent-soft:#DAECE9; --accent-ink:#FFFFFF;
  --crit:#A62119; --crit-soft:#FAE3E1;
  --high:#9C5C00; --high-soft:#F9EBD4;
  --med:#2A5D91;  --med-soft:#E0EBF6;
  --low:#376F4B;  --low-soft:#E0EFE5;
  --done:#5A6B68; --done-soft:#E6ECEB;
  --shadow:0 1px 2px rgba(15,26,24,.05), 0 10px 30px -18px rgba(15,26,24,.35);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A100F; --surface:#111B19; --surface-2:#172422; --raised:#152220;
    --line:#25332F; --line-soft:#1B2826;
    --ink:#E7EEEC; --ink-2:#B3C3C0; --muted:#84948F;
    --accent:#3FA595; --accent-2:#5CC3B2; --accent-soft:#143029; --accent-ink:#04120F;
    --crit:#F08279; --crit-soft:#341A17;
    --high:#DFA45C; --high-soft:#32250F;
    --med:#7BAEDF;  --med-soft:#14232E;
    --low:#7CC08F;  --low-soft:#132618;
    --done:#93A29F; --done-soft:#1B2726;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0A100F; --surface:#111B19; --surface-2:#172422; --raised:#152220;
  --line:#25332F; --line-soft:#1B2826;
  --ink:#E7EEEC; --ink-2:#B3C3C0; --muted:#84948F;
  --accent:#3FA595; --accent-2:#5CC3B2; --accent-soft:#143029; --accent-ink:#04120F;
  --crit:#F08279; --crit-soft:#341A17;
  --high:#DFA45C; --high-soft:#32250F;
  --med:#7BAEDF;  --med-soft:#14232E;
  --low:#7CC08F;  --low-soft:#132618;
  --done:#93A29F; --done-soft:#1B2726;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-0.01em}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}

.wrap{max-width:1180px; margin:0 auto; padding:0 18px}
.form-wrap{max-width:720px}

/* ---------- header ---------- */
.masthead{
  background:var(--surface); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:40;
}
.masthead-in{display:flex; align-items:center; gap:16px; min-height:62px; flex-wrap:wrap; padding-top:8px; padding-bottom:8px}
.brand{display:flex; align-items:center; gap:11px; margin-right:auto}
.brand-mark{
  width:34px;height:34px;border-radius:8px;overflow:hidden;flex:none;
  display:grid;place-items:center;background:#FFDA35;
  box-shadow:0 0 0 1px rgba(15,26,24,.08) inset;
}
.brand-mark img{width:100%;height:100%;display:block}
.brand-name{font-family:Archivo,sans-serif;font-weight:700;font-size:16px;letter-spacing:-0.015em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;line-height:1.1;margin-top:2px}
.tabs{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:9px}
.tab{
  border:0;background:transparent;padding:7px 13px;border-radius:7px;cursor:pointer;
  font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}

/* ---------- page intro ---------- */
.intro{padding:30px 0 22px}
.intro h1{font-size:clamp(25px,4.2vw,34px);font-weight:700}
.intro p{margin:8px 0 0;color:var(--muted);max-width:60ch}

/* ---------- form ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.fset{border:0;margin:0 0 16px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.fset > legend{
  padding:0; margin:0 0 0 18px;
  font-family:Archivo,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
}
.fset-body{padding:14px 18px 20px; display:flex; flex-direction:column; gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.row2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-weight:600;font-size:13.5px}
.req{color:var(--crit);font-weight:700}
.hint{font-size:12.5px;color:var(--muted);margin:0}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=url],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);
  transition:border-color .12s, background .12s;
}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:var(--surface-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input,:root:not([data-theme="light"]) select,:root:not([data-theme="light"]) textarea{background:var(--surface-2)}}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:104px;resize:vertical;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.err{border-color:var(--crit) !important}
.errmsg{font-size:12.5px;color:var(--crit);font-weight:500}

/* priority chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;display:inline-flex}
.chip-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
  padding:7px 13px 7px 11px;cursor:pointer;font-size:13.5px;font-weight:500;background:var(--surface);
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.chip.p-critical{color:var(--crit)} .chip.p-high{color:var(--high)}
.chip.p-medium{color:var(--med)}   .chip.p-low{color:var(--low)}
.chip span.txt{color:var(--ink-2)}
.chip-in:checked + .chip{border-color:currentColor;background:var(--accent-soft)}
.chip-in:checked + .chip.p-critical{background:var(--crit-soft)}
.chip-in:checked + .chip.p-high{background:var(--high-soft)}
.chip-in:checked + .chip.p-medium{background:var(--med-soft)}
.chip-in:checked + .chip.p-low{background:var(--low-soft)}
.chip-in:checked + .chip span.txt{color:var(--ink);font-weight:600}
.chip-in:focus-visible + .chip{outline:2px solid var(--accent);outline-offset:2px}

/* uploader */
.drop{
  border:1.5px dashed var(--line);border-radius:9px;padding:18px;text-align:center;background:var(--ground);
  cursor:pointer;transition:border-color .12s,background .12s;
}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:14px}
.drop small{color:var(--muted);font-size:12.5px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.thumb{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .vtag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;font-family:"IBM Plex Mono",monospace}
.thumb .kill{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center}
.meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .2s}
.meter.warn i{background:var(--high)} .meter.hot i{background:var(--crit)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:11px 18px;
  border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14.5px;cursor:pointer;
  transition:background .12s,transform .06s;
}
.btn:hover{background:var(--accent-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--crit);color:#fff}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 40px}

/* notices */
.notice{border-radius:9px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;border:1px solid}
.notice.info{background:var(--med-soft);border-color:transparent;color:var(--ink)}
.notice.warn{background:var(--high-soft);border-color:transparent;color:var(--ink)}
.notice.bad{background:var(--crit-soft);border-color:transparent;color:var(--ink)}
.notice.good{background:var(--low-soft);border-color:transparent;color:var(--ink)}
.notice b{font-weight:600}

/* success */
.success{text-align:center;padding:44px 24px}
.success .tick{width:56px;height:56px;border-radius:50%;background:var(--low-soft);color:var(--low);display:grid;place-items:center;margin:0 auto 16px;font-size:28px}
.success h2{font-size:23px}
.success .idbox{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500;letter-spacing:.04em;margin:14px 0 6px;color:var(--accent)}

/* ---------- admin ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:Archivo,sans-serif;font-size:29px;font-weight:700;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.crit .val{color:var(--crit)} .kpi.late .val{color:var(--high)} .kpi.ok .val{color:var(--low)}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=text],.toolbar select{width:auto;padding:8px 11px;font-size:13.5px;background:var(--surface)}
.toolbar select{padding-right:32px}
.toolbar .grow{flex:1 1 210px;min-width:170px}
.spacer{flex:1 1 auto}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1120px;font-size:13.5px}
table td:nth-child(2),table th:nth-child(2){min-width:250px}
table td:nth-child(3),table th:nth-child(3){min-width:190px}
table td:nth-child(10),table th:nth-child(10){min-width:190px}
thead th{
  text-align:left;padding:11px 12px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0;
}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.tid{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent);font-weight:500;white-space:nowrap}
.ttitle{font-weight:600;color:var(--ink)}
.tsub{color:var(--muted);font-size:12.5px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pri-critical{background:var(--crit-soft);color:var(--crit)}
.pri-high{background:var(--high-soft);color:var(--high)}
.pri-medium{background:var(--med-soft);color:var(--med)}
.pri-low{background:var(--low-soft);color:var(--low)}
.pri-unrated{background:var(--done-soft);color:var(--done)}
.st-new{background:var(--crit-soft);color:var(--crit)}
.st-assigned{background:var(--med-soft);color:var(--med)}
.st-in-progress{background:var(--accent-soft);color:var(--accent)}
.st-on-hold{background:var(--high-soft);color:var(--high)}
.st-resolved{background:var(--low-soft);color:var(--low)}
.st-closed{background:var(--done-soft);color:var(--done)}
.late{color:var(--crit);font-weight:600}

.empty{padding:52px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:Archivo,sans-serif;font-size:17px;margin-bottom:4px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,16,15,.5);z-index:60;opacity:0;animation:fade .16s forwards}
@keyframes fade{to{opacity:1}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:61;
  border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(14px);opacity:0;animation:slide .18s forwards;
}
@keyframes slide{to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.drawer{animation:none;opacity:1;transform:none}}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-head h2{font-size:18px;flex:1}
.drawer-body{padding:18px 20px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.xbtn{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;flex:none;color:var(--ink-2)}
.xbtn:hover{background:var(--line)}
.deftable{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px}
.deftable dt{color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding-top:2px}
.deftable dd{margin:0}
.desc{background:var(--ground);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:14px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
.media-grid a,.media-grid .mi{display:block;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.media-grid img,.media-grid video{width:100%;display:block;aspect-ratio:1;object-fit:cover}
.sect-h{font-family:Archivo,sans-serif;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.log{display:flex;flex-direction:column;gap:0}
.logitem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding-bottom:14px}
.logitem .rail{width:9px;display:flex;flex-direction:column;align-items:center}
.logitem .rail i{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px}
.logitem .rail s{flex:1;width:1.5px;background:var(--line);text-decoration:none;margin-top:3px}
.logitem:last-child .rail s{display:none}
.logitem .when{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.logitem .what{font-size:13.5px;margin-top:1px}

.stickyfoot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;background:var(--surface)}

/* misc */
.pinbox{max-width:380px;margin:44px auto;padding:26px}
.pinbox h2{font-size:19px;margin-bottom:6px}
.foot{padding:26px 0 40px;color:var(--muted);font-size:12.5px;text-align:center}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:90vw;text-align:center;
}
.hide{display:none !important}
.cards{display:none;flex-direction:column;gap:10px}
@media (max-width:760px){
  .tablewrap{display:none}
  .cards{display:flex}
  .masthead-in{min-height:0}
  .tabs{width:100%}
  .tab{flex:1}
}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);cursor:pointer}
.tcard .top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:5px}
.tcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}

/* ---------- ageing ---------- */
.agepanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px 14px;box-shadow:var(--shadow);margin-bottom:18px}
.agepanel .ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.agepanel .ph h3{font-size:13px;font-family:Archivo,sans-serif;letter-spacing:.02em}
.agepanel .ph .sub{font-size:12.5px;color:var(--muted)}
.agebar{display:flex;gap:2px;height:26px;border-radius:5px;overflow:hidden}
.agebar .seg{
  display:flex;align-items:center;justify-content:center;min-width:3px;cursor:pointer;
  font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:#0B2723;
  border:0;padding:0;transition:filter .12s;
}
.agebar .seg:hover{filter:brightness(1.06)}
.agebar .seg.on{box-shadow:inset 0 0 0 2px var(--ink)}
.agebar .seg.deep{color:#F2FAF8}
.agelegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px}
.agelegend button{
  display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;
  font-size:12.5px;color:var(--ink-2);padding:2px 0;border-radius:5px;
}
.agelegend button:hover{color:var(--ink)}
.agelegend button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.agelegend .sw{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.08) inset}
.agelegend .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.agelegend button[aria-pressed="true"] .n{color:var(--ink)}
.ageempty{font-size:13px;color:var(--muted)}

.agecell{display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.agecell .sw{width:9px;height:9px;border-radius:2px;flex:none}

/* ---------- money ---------- */
.money{font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace;font-size:13px}
.invlist{display:flex;flex-direction:column}
.invrow{padding:10px 0;border-top:1px solid var(--line-soft)}
.invrow:first-child{border-top:0;padding-top:0}
.invmain{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.invmain .v{font-weight:600;font-size:14px}
.invmain .a{font-weight:600;font-size:15px;white-space:nowrap}
.invmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--muted)}
.invmeta a{font-size:12.5px}
.inv-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;padding-top:10px;border-top:1.5px solid var(--line)}
.inv-total .lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.inv-total .amt{font-family:Archivo,sans-serif;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

/* ============ small helpers ============ */
function $(sel,root){return (root||document).querySelector(sel);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function todayISO(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso.length<=10 ? iso+"T00:00:00" : iso);
  if(isNaN(d)) return esc(iso);
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtWhen(iso){
  var d=new Date(iso); if(isNaN(d)) return "";
  return d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}
function bytes(n){ if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(0)+" KB"; return (n/1048576).toFixed(1)+" MB"; }
function isOpen(t){ return t.status!=="Resolved" && t.status!=="Closed"; }
function isLate(t){ return !!t.due && isOpen(t) && t.due < todayISO(); }

/* ---- ageing ---- */
function ageDays(t){
  var startS = t.created;
  var endS = isOpen(t) ? new Date().toISOString() : (t.closedAt || t.updated || t.created);
  var a = new Date(startS), b = new Date(endS);
  if(isNaN(a)||isNaN(b)) return 0;
  return Math.max(0, Math.floor((b-a)/86400000));
}
function ageBucket(d){
  for(var i=0;i<AGE_BUCKETS.length;i++){ if(d>=AGE_BUCKETS[i].min && d<=AGE_BUCKETS[i].max) return AGE_BUCKETS[i]; }
  return AGE_BUCKETS[AGE_BUCKETS.length-1];
}
function isDark(){
  var r=document.documentElement.getAttribute("data-theme");
  if(r==="dark") return true; if(r==="light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function bucketColor(b){ return isDark() ? b.dark : b.light; }
function ageLabel(t){ var d=ageDays(t); return d===0 ? "today" : d+" day"+(d===1?"":"s"); }

/* ---- money ---- */
function ticketCost(t){
  return (t.invoices||[]).reduce(function(s,i){ var n=parseFloat(i.amount); return s+(isNaN(n)?0:n); },0);
}
function fmtINR(n){
  if(!n) return "—";
  try{ return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:0}); }
  catch(e){ return "₹"+Math.round(n); }
}

function toast(msg,ms){
  var old=$(".toast"); if(old) old.remove();
  var el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.remove(); }, ms||3200);
}

/* ============ persistence ============ */
/* Two modes:
   - "server"  : CONFIG.apiUrl is set  -> Google Apps Script (or any compatible endpoint)
   - "local"   : no apiUrl             -> this browser only, for trying it out
*/
function apiPost(payload){
  return fetch(CONFIG.apiUrl,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},  // keeps it a simple request, no CORS preflight
    body:JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}
function fileToB64(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ var s=String(fr.result); res(s.slice(s.indexOf(",")+1)); };
    fr.onerror=rej;
    fr.readAsDataURL(file);
  });
}
function packFiles(files){
  var paths = files ? Object.keys(files) : [];
  if(!paths.length) return Promise.resolve([]);
  return Promise.all(paths.map(function(p){
    return fileToB64(files[p]).then(function(b64){
      return {path:p, name:files[p].name||p.split("/").pop(), mime:files[p].type||"application/octet-stream", b64:b64};
    });
  }));
}

/* Returns {ok:true} or {ok:false, code:"..."} */
function persist(next, files){
  next.rev=(next.rev||0)+1;
  next.savedAt=new Date().toISOString();

  if(CONFIG.apiUrl){
    return packFiles(files).then(function(fl){
      return apiPost({action:"save", state:next, files:fl});
    }).then(function(j){
      if(!j || !j.ok){
        if(j && j.code==="conflict" && j.state){ S=j.state; render(); }
        return {ok:false, code:(j&&j.code)||"upstream_error"};
      }
      if(j.state) { next.tickets = j.state.tickets; next.rev = j.state.rev; }
      MODE="server";
      return {ok:true, mode:"server"};
    }, function(){ return {ok:false, code:"offline"}; });
  }

  // local fallback
  var hasVideo=false;
  (next.tickets||[]).forEach(function(t){
    if(t.media) t.media = t.media.filter(function(m){ if(m.path && !/^https?:/.test(m.path)){ hasVideo=true; return false; } return true; });
    (t.invoices||[]).forEach(function(i){ if(i.file && i.file.path && !/^https?:/.test(i.file.path)){ delete i.file; hasVideo=true; } });
  });
  try{
    localStorage.setItem("fmd_state", JSON.stringify(next));
    MODE="local";
    return Promise.resolve({ok:true, mode:"local", droppedFiles:hasVideo});
  }catch(e){
    return Promise.resolve({ok:false, code:"too_large"});
  }
}

function errorText(code){
  switch(code){
    case "conflict": return "Someone saved a change a moment before you and the tracker has refreshed. Please press Submit again.";
    case "offline":  return "Couldn't reach the tracker's storage. Check the internet connection and try again — nothing has been lost.";
    case "not_configured": return "This copy isn't connected to shared storage yet, so tickets stay on this device only. Ask your admin to finish the setup.";
    case "too_large": return "This browser's storage is full. Connect the tracker to shared storage, or export and clear old tickets.";
    case "rate_limited": return "Too many saves at once. Wait about ten seconds and try again.";
    default: return "Couldn't save right now. Your entry is still on screen — please try again in a moment.";
  }
}

function modeBanner(){
  if(MODE==="server") return "";
  return '<div class="wrap" style="padding-top:14px"><div class="notice warn"><span>&#9888;</span><div>'
    + '<b>Demo mode.</b> This copy is not connected to shared storage, so tickets are saved in this browser only &mdash; nobody else can see them. '
    + 'Set <code>apiUrl</code> at the top of this file to switch the whole team onto one shared tracker.'
    + '</div></div></div>';
}

/* ============ boot ============ */
function defaults(){
  try{ return JSON.parse(document.getElementById("seed-data").textContent); }
  catch(e){ return {rev:0,seq:0,tickets:[],assignees:["Facilities Team"],pin:"frido2026"}; }
}
function adopt(j){
  if(!j || typeof j.rev!=="number") return false;
  S=j; if(!S.tickets) S.tickets=[]; if(!S.assignees) S.assignees=["Facilities Team"];
  return true;
}
function boot(){
  S = defaults();
  READONLY = false;
  render();
  if(CONFIG.apiUrl){
    MODE="server";
    fetch(CONFIG.apiUrl,{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
      if(adopt(j && j.state ? j.state : j)) render();
    }).catch(function(){ toast("Couldn't load tickets from shared storage. Check the connection.",6000); });
    setInterval(refresh, 45000);
    document.addEventListener("visibilitychange",function(){ if(!document.hidden) refresh(); });
  } else {
    MODE="local";
    var raw=null; try{ raw=localStorage.getItem("fmd_state"); }catch(e){}
    if(raw){ try{ adopt(JSON.parse(raw)); }catch(e){} }
    render();
  }
  restoreDraft();
}
function refresh(){
  if(!CONFIG.apiUrl || busy || document.querySelector(".drawer")) return;
  fetch(CONFIG.apiUrl,{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
    var st = (j && j.state) ? j.state : j;
    if(st && typeof st.rev==="number" && st.rev > (S.rev||0)){ adopt(st); render(); }
  }).catch(function(){});
}

function stashDraft(o){ try{ sessionStorage.setItem("fmd_draft", JSON.stringify(o)); }catch(e){} }
function clearDraft(){ try{ sessionStorage.removeItem("fmd_draft"); }catch(e){} }
function restoreDraft(){
  var raw=null; try{ raw=sessionStorage.getItem("fmd_draft"); }catch(e){}
  if(!raw) return;
  var d=null; try{ d=JSON.parse(raw); }catch(e){ return; }
  if(!d) return;
  setTimeout(function(){
    ["rname","remail","rphone","rtitle","rdesc"].forEach(function(id){ var el=document.getElementById(id); if(el&&d[id]) el.value=d[id]; });
    ["rstore","rcat"].forEach(function(id){ var el=document.getElementById(id); if(el&&d[id]) el.value=d[id]; });
    if(d.vlink){ var v=document.getElementById("rvlink"); if(v) v.value=d.vlink; }
    var n=document.getElementById("restored"); if(n) n.classList.remove("hide");
  },0);
}

/* Ageing of open tickets — ordered bins, one sequential hue, light = fresh. */
function agePanel(open){
  var counts = AGE_BUCKETS.map(function(b){ return open.filter(function(t){ return ageBucket(ageDays(t))===b; }).length; });
  var total = counts.reduce(function(a,b){return a+b;},0);
  var oldest = open.reduce(function(m,t){ var d=ageDays(t); return d>m?d:m; },0);

  var head = '<div class="ph"><h3>Ageing of open tickets</h3><span class="sub">'
    + (total ? total+' open · oldest is '+oldest+' day'+(oldest===1?'':'s')+' old' : 'nothing open right now')
    + '</span></div>';

  if(!total) return '<div class="agepanel">'+head+'<p class="ageempty">Every ticket raised so far has been resolved or closed.</p></div>';

  var bar = '<div class="agebar" role="img" aria-label="Open tickets by age: '
    + AGE_BUCKETS.map(function(b,i){ return counts[i]+' '+b.label; }).join(", ")+'">'
    + AGE_BUCKETS.map(function(b,i){
        if(!counts[i]) return "";
        var pct = counts[i]/total*100;
        var deep = i>=3;
        return '<button class="seg'+(deep?" deep":"")+(filters.age===b.key?" on":"")+'" data-age="'+b.key+'" '
          + 'style="width:'+pct.toFixed(2)+'%;background:'+bucketColor(b)+'" '
          + 'title="'+esc(b.label)+' — '+counts[i]+' open">'+(pct>7?counts[i]:"")+'</button>';
      }).join("")
    + '</div>';

  var legend = '<div class="agelegend">'
    + AGE_BUCKETS.map(function(b,i){
        return '<button data-age="'+b.key+'" aria-pressed="'+(filters.age===b.key)+'">'
          + '<span class="sw" style="background:'+bucketColor(b)+'"></span>'
          + esc(b.label)+' <span class="n">'+counts[i]+'</span></button>';
      }).join("")
    + (filters.age ? '<button data-age="" aria-pressed="false" style="color:var(--accent)">Clear filter</button>' : '')
    + '</div>';

  return '<div class="agepanel">'+head+bar+legend+'</div>';
}
function kpi(lbl,val,cls){ return '<div class="kpi '+cls+'"><div class="lbl">'+esc(lbl)+'</div><div class="val">'+val+'</div></div>'; }
function uniq(a){ var o=[],seen={}; a.forEach(function(x){ if(!seen[x]){seen[x]=1;o.push(x);} }); return o.sort(); }
function filterSel(id,label,opts,val){
  return '<select id="'+id+'"><option value="">'+esc(label)+': all</option>'
    +opts.map(function(o){ return '<option value="'+esc(o)+'"'+(o===val?" selected":"")+'>'+esc(o)+'</option>'; }).join("")+'</select>';
}
function filtered(){
  var q=filters.q.trim().toLowerCase();
  var list = S.tickets.filter(function(t){
    if(filters.city && t.city!==filters.city) return false;
    if(filters.store && t.store!==filters.store) return false;
    if(filters.cat && t.category!==filters.cat) return false;
    if(filters.pri){ var p=t.priority||UNRATED; if(p!==filters.pri) return false; }
    if(filters.st && t.status!==filters.st) return false;
    if(filters.asg){ var a=t.assignee||"Unassigned"; if(a!==filters.asg) return false; }
    if(filters.late && !isLate(t)) return false;
    if(filters.age){ if(!isOpen(t) || ageBucket(ageDays(t)).key!==filters.age) return false; }
    if(q){
      var vendors=(t.invoices||[]).map(function(i){return (i.vendor||"")+" "+(i.no||"");}).join(" ");
      var hay=[t.id,t.title,t.store,t.city,t.category,t.priority,t.status,t.assignee,t.reporter&&t.reporter.name,t.description,vendors].join(" ").toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  /* Open before closed, overdue first, then oldest first — ageing is the lens. */
  return list.sort(function(a,b){
    var ao=isOpen(a)?0:1, bo=isOpen(b)?0:1;
    if(ao!==bo) return ao-bo;
    var al=isLate(a)?0:1, bl=isLate(b)?0:1;
    if(al!==bl) return al-bl;
    var ad=ageDays(a), bd=ageDays(b);
    if(ad!==bd) return bd-ad;
    return String(b.created).localeCompare(String(a.created));
  });
}

function ageCell(t){

function wireDrawer(){
  var cf=document.getElementById("c-files");
  if(cf) cf.addEventListener("change",function(){
    var files=Array.prototype.slice.call(cf.files||[]);
    var chain=Promise.resolve();
    files.forEach(function(f){
      chain=chain.then(function(){
        if(cdraft.length>=MAX_PHOTOS){ toast("Up to "+MAX_PHOTOS+" completion photos at a time."); return; }
        if(!/^image\//.test(f.type)){ toast("Completion proof should be a photo."); return; }
        return compressPhoto(f).then(function(d){ cdraft.push({name:f.name,data:d}); },function(){});
      });
    });
    chain.then(function(){ cf.value=""; paintCDraft(); });
  });
  paintCDraft();

  var inf=document.getElementById("i-file");
  if(inf) inf.addEventListener("change",function(){
    var f=inf.files&&inf.files[0];
    if(!f){ idraft.file=null; return; }
    if(f.size>10*1048576){ toast("That file is "+bytes(f.size)+" — keep invoices under 10 MB."); inf.value=""; return; }
    idraft.file=f;
    var n=document.getElementById("i-fname"); if(n) n.textContent=f.name+" · "+bytes(f.size);
  });
}
function closeDrawer(keep){
  var s=$(".scrim"), d=$(".drawer");
  if(s) s.remove(); if(d) d.remove();
  document.body.style.overflow="";
  if(!keep) OPEN_ID=null;
}
function mediaHTML(t){
  var out="";
  if(t.media && t.media.length){
    out += '<div><div class="sect-h">Attachments</div><div class="media-grid">'

/* ============ media handling ============ */
function compressPhoto(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,PHOTO_MAX_DIM/Math.max(w,h));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(w*scale)); c.height=Math.max(1,Math.round(h*scale));
      var ctx=c.getContext("2d");
      ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      try{ res(c.toDataURL("image/jpeg",PHOTO_QUALITY)); }catch(e){ rej(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src=url;
  });
}
function addFiles(list){
  var files=Array.prototype.slice.call(list||[]);
  var chain=Promise.resolve();
  files.forEach(function(f){
    chain=chain.then(function(){
      if(/^image\//.test(f.type)){
        if(draft.photos.length>=MAX_PHOTOS){ toast("Photo limit is "+MAX_PHOTOS+" — remove one first."); return; }
        return compressPhoto(f).then(function(dataUrl){
          draft.photos.push({kind:"photo",name:f.name,data:dataUrl,size:Math.round(dataUrl.length*0.75)});
        },function(){ toast("Couldn't read "+f.name+"."); });
      }
      if(/^video\//.test(f.type)){
        if(!CONFIG.apiUrl){ toast("Video upload needs the shared storage setup. Paste a video link instead.",5000); return; }
        if(draft.videos.length>=MAX_VIDEOS){ toast("Video limit is "+MAX_VIDEOS+"."); return; }
        if(f.size > MAX_VIDEO_MB*1048576){ toast(f.name+" is "+bytes(f.size)+" — over the "+MAX_VIDEO_MB+" MB limit. Paste a link instead."); return; }
        draft.videos.push({kind:"video",name:f.name,file:f,size:f.size,url:URL.createObjectURL(f)});
        return;
      }
      toast("Only photos and videos can be attached.");
    });
  });
  chain.then(paintThumbs);
}
function paintThumbs(){
  var box=document.getElementById("thumbs"); if(!box) return;
  var all=draft.photos.concat(draft.videos);
  box.innerHTML=all.map(function(m,i){
    var inner = m.kind==="video"
      ? '<video src="'+esc(m.url)+'" preload="metadata" muted></video><span class="vtag">'+bytes(m.size)+'</span>'
      : '<img src="'+esc(m.data)+'" alt="">';
    return '<div class="thumb">'+inner+'<button type="button" class="kill" data-kill="'+i+'" aria-label="Remove">✕</button></div>';
  }).join("");
  var used=stateSize(S) + draft.photos.reduce(function(a,p){return a+p.data.length;},0);
  var pct=Math.min(100,Math.round(used/SOFT_BUDGET*100));
  var m=document.getElementById("meter");
  if(m){ m.className="meter"+(pct>75?" warn":"")+(pct>90?" hot":""); m.firstChild.style.width=pct+"%"; }
  var mt=document.getElementById("metertxt");
  if(mt) mt.textContent="Storage used: "+bytes(used)+" of about 11 MB"+(draft.videos.length?" (video clips are stored separately)":"");
}

function submitTicket(e){
  e.preventDefault();
  if(busy) return;
  var v=function(id){ var el=document.getElementById(id); return el?el.value.trim():""; };
  var data={
    store:v("rstore"), name:v("rname"), phone:v("rphone"), email:v("remail"),
    cat:v("rcat"), title:v("rtitle"), desc:v("rdesc"), vlink:v("rvlink")
  };
  var missing=[];
  [["rstore",data.store],["rname",data.name],["rphone",data.phone],["rcat",data.cat],["rtitle",data.title],["rdesc",data.desc]].forEach(function(p){
    var wrap=document.querySelector('[data-for="'+p[0]+'"]'); var el=document.getElementById(p[0]);
    if(!p[1]){ missing.push(p[0]); if(el) el.classList.add("err"); }
    else if(el) el.classList.remove("err");
    if(wrap){}
  });
  if(missing.length){
    $("#formerr").innerHTML='<div class="notice bad"><span>!</span><div>Please fill the highlighted fields.</div></div>';
    var first=document.getElementById(missing[0]); if(first) first.focus();
    return;
  }
  $("#formerr").innerHTML="";
  stashDraft({rname:data.name,remail:data.email,rphone:data.phone,rtitle:data.title,rdesc:data.desc,rstore:data.store,rcat:data.cat,vlink:data.vlink});

  var storeName=data.store.split(" · ")[0];
  var now=new Date().toISOString();
  var id=nextId();
  var media=[], files={};
  draft.photos.forEach(function(p,i){ media.push({kind:"photo",name:p.name,data:p.data}); });
  draft.videos.forEach(function(vd,i){
    var ext=(vd.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"");
    if(["mp4","webm","mov","m4v"].indexOf(ext)<0) ext="mp4";
    var path="media/"+id.toLowerCase()+"-"+(i+1)+"."+(ext==="mov"?"mp4":ext);
    media.push({kind:"video",name:vd.name,path:path,size:vd.size});
    files[path]=vd.file;
    BLOBS[path]=vd.url;
  });

  var t={
    id:id, created:now, updated:now,
    store:storeName, city:cityOf(storeName)||"",
    reporter:{name:data.name,phone:data.phone,email:data.email},
    category:data.cat, priority:UNRATED, title:data.title, description:data.desc,
    media:media, videoLink:data.vlink,
    invoices:[], completion:[], closedAt:"",
    assignee:"", due:"", status:"New",
    log:[{at:now, by:data.name, status:"New", text:"Ticket raised from "+storeName}]
  };

  var next=JSON.parse(JSON.stringify({rev:S.rev,seq:S.seq,tickets:S.tickets,assignees:S.assignees,pin:S.pin,lastEditor:S.lastEditor}));
  next.tickets.push(t); next.seq=(S.seq||0)+1;

  if(stateSize(next) > SOFT_BUDGET){
    $("#formerr").innerHTML='<div class="notice bad"><span>!</span><div>The tracker is nearly full. Remove a photo or two and try again, or ask the admin to clear attachments from closed tickets.</div></div>';
    return;
  }

  setBusy(true,"submitbtn","Submitting…");
  persist(next, files).then(function(r){
    setBusy(false,"submitbtn","Submit ticket");
    if(!r.ok){
      $("#formerr").innerHTML='<div class="notice bad"><span>!</span><div>'+esc(errorText(r.code))+'</div></div>';
      window.scrollTo({top:0,behavior:"smooth"});
      return;
    }
    S=next; clearDraft();
    if(r.droppedFiles && draft.videos.length){
      toast("Ticket saved, but the video couldn't be attached here — please paste a video link on the ticket.",6000);
    }
    draft={photos:[],videos:[]};
    window.__lastTicket=t; trackStore=t.store;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

function saveTicket(id){
  if(busy) return;
  var t=null,idx=-1;
  S.tickets.forEach(function(x,i){ if(x.id===id){t=x;idx=i;} });
  if(!t) return;
  var asg=$("#d-asg").value, due=$("#d-due").value, st=$("#d-st").value, note=$("#d-note").value.trim(), by=$("#d-by").value.trim();
  var pri=$("#d-pri")?$("#d-pri").value:(t.priority||UNRATED);
  var changes=[];
  if(asg!==(t.assignee||"")) changes.push(asg?("Assigned to "+asg):"Unassigned");
  if(due!==(t.due||"")) changes.push(due?("Due date set to "+fmtDate(due)):"Due date cleared");
  if(pri!==(t.priority||UNRATED)) changes.push("Priority set to "+pri);
  var statusChanged = st!==t.status;
  if(!changes.length && !statusChanged && !note){ toast("Nothing to save yet."); return; }

  var next=JSON.parse(JSON.stringify({rev:S.rev,seq:S.seq,tickets:S.tickets,assignees:S.assignees,pin:S.pin,lastEditor:by||S.lastEditor}));
  var nt=next.tickets[idx];
  nt.assignee=asg; nt.due=due; nt.status=st; nt.priority=pri; nt.updated=new Date().toISOString();
  var closing = (st==="Resolved"||st==="Closed");
  if(closing && !nt.closedAt) nt.closedAt=nt.updated;
  if(!closing) nt.closedAt="";
  nt.log=nt.log||[];
  nt.log.push({at:nt.updated, by:by||"Admin", status: statusChanged?st:"", text: [note].concat(changes).filter(Boolean).join(" · ")});

  setBusy(true,null,null);
  persist(next).then(function(r){
    setBusy(false);
    if(!r.ok){ toast(errorText(r.code),6000); return; }
    S=next; OPEN_ID=id; render(); toast("Ticket "+id+" updated.");
  });
}

/* ---------- invoices & proof of work ---------- */
var cdraft = [];              // completion photos waiting to be saved (data URIs)
var idraft = { file:null };   // invoice attachment waiting to be saved

function cloneState(extra){
  var base={rev:S.rev,seq:S.seq,tickets:S.tickets,assignees:S.assignees,pin:S.pin,lastEditor:S.lastEditor};
  if(extra) for(var k in extra) base[k]=extra[k];
  return JSON.parse(JSON.stringify(base));
}
function findIdx(id){ var n=-1; S.tickets.forEach(function(x,i){ if(x.id===id) n=i; }); return n; }

function addInvoice(id){
  if(busy) return;
  var idx=findIdx(id); if(idx<0) return;
  var vendor=$("#i-vendor").value.trim(), no=$("#i-no").value.trim(), date=$("#i-date").value;
  var amtRaw=$("#i-amt").value.replace(/[₹,\s]/g,""), status=$("#i-stat").value;
  var by=($("#d-by")&&$("#d-by").value.trim())||S.lastEditor||"Admin";
  var amt=parseFloat(amtRaw);
  if(!vendor){ toast("Add the vendor's name."); $("#i-vendor").focus(); return; }
  if(isNaN(amt)||amt<0){ toast("Enter the invoice amount in rupees."); $("#i-amt").focus(); return; }

  var now=new Date().toISOString();
  var invId="INV"+Math.abs(new Date(now).getTime()).toString(36).toUpperCase();
  var inv={id:invId, vendor:vendor, no:no, date:date, amount:amt, status:status, addedAt:now, addedBy:by};
  var files=null;

  var prep = Promise.resolve();
  if(idraft.file){
    var f=idraft.file;
    if(/^image\//.test(f.type)){
      prep = compressPhoto(f).then(function(d){ inv.file={kind:"photo",name:f.name,data:d}; },function(){});
    } else {
      var path="invoices/"+id.toLowerCase()+"-"+invId.toLowerCase()+".pdf";
      inv.file={kind:"pdf",name:f.name,path:path};
      files={}; files[path]=f; BLOBS[path]=URL.createObjectURL(f);
    }
  }

  prep.then(function(){
    var next=cloneState({lastEditor:by});
    var nt=next.tickets[idx];
    nt.invoices=nt.invoices||[]; nt.invoices.push(inv);
    nt.updated=now; nt.log=nt.log||[];
    nt.log.push({at:now, by:by, status:"", text:"Invoice added — "+vendor+" "+fmtINR(amt)+(no?" ("+no+")":"")});
    setBusy(true);
    return persist(next, files).then(function(r){
      setBusy(false);
      if(!r.ok){ toast(errorText(r.code),6000); return; }
      if(r.droppedFiles) toast("Invoice saved, but the PDF couldn't be attached here. Try a photo of the invoice instead.",6000);
      S=next; idraft.file=null; OPEN_ID=id; render(); toast("Invoice added to "+id+".");
    });
  });
}

function delInvoice(id, invId){
  var idx=findIdx(id); if(idx<0) return;
  var next=cloneState();
  var nt=next.tickets[idx];
  nt.invoices=(nt.invoices||[]).filter(function(i){ return i.id!==invId; });
  nt.updated=new Date().toISOString();
  persist(next).then(function(r){
    if(!r.ok){ toast(errorText(r.code),6000); return; }
    S=next; OPEN_ID=id; render(); toast("Invoice removed.");
  });
}

function addCompletion(id){
  if(busy) return;
  if(!cdraft.length){ toast("Choose the completion photos first."); return; }
  var idx=findIdx(id); if(idx<0) return;
  var by=($("#d-by")&&$("#d-by").value.trim())||S.lastEditor||"Admin";
  var now=new Date().toISOString();
  var next=cloneState({lastEditor:by});
  var nt=next.tickets[idx];
  nt.completion=(nt.completion||[]).concat(cdraft.map(function(p){ return {name:p.name,data:p.data,at:now,by:by}; }));
  nt.updated=now; nt.log=nt.log||[];
  nt.log.push({at:now, by:by, status:"", text:cdraft.length+" completion photo"+(cdraft.length>1?"s":"")+" added"});

  if(stateSize(next)>SOFT_BUDGET){ toast("Not enough space left — remove a photo or clear attachments from closed tickets.",6000); return; }
  setBusy(true);
  persist(next).then(function(r){
    setBusy(false);
    if(!r.ok){ toast(errorText(r.code),6000); return; }
    S=next; cdraft=[]; OPEN_ID=id; render(); toast("Proof of work saved on "+id+".");
  });
}

}

function stripMedia(id, silent){
  var next=JSON.parse(JSON.stringify({rev:S.rev,seq:S.seq,tickets:S.tickets,assignees:S.assignees,pin:S.pin,lastEditor:S.lastEditor}));
  next.tickets.forEach(function(t){ if(t.id===id) t.media=[]; });
  persist(next).then(function(r){
    if(!r.ok){ toast(errorText(r.code),6000); return; }
    S=next; render(); if(!silent) toast("Attachments removed from "+id+".");
  });
}
function purgeClosed(){
  var n=0;
  var next=JSON.parse(JSON.stringify({rev:S.rev,seq:S.seq,tickets:S.tickets,assignees:S.assignees,pin:S.pin,lastEditor:S.lastEditor}));
  next.tickets.forEach(function(t){ if((t.status==="Closed"||t.status==="Resolved") && t.media && t.media.length){ t.media=[]; n++; } });
  if(!n){ toast("No closed tickets have attachments."); return; }
  persist(next).then(function(r){
    if(!r.ok){ toast(errorText(r.code),6000); return; }
    S=next; closeDrawer(); render(); toast("Cleared attachments from "+n+" ticket"+(n>1?"s":"")+".");
  });
}
function saveSettings(){
  var names=$("#s-asg").value.split("\n").map(function(x){return x.trim();}).filter(Boolean);
  var pin=$("#s-pin").value.trim();
  var next=JSON.parse(JSON.stringify({rev:S.rev,seq:S.seq,tickets:S.tickets,assignees:names.length?names:["Facilities Team"],pin:pin||S.pin,lastEditor:S.lastEditor}));
  persist(next).then(function(r){
    if(!r.ok){ toast(errorText(r.code),6000); return; }
    S=next; closeDrawer(); render(); toast("Settings saved.");
  });
}

function csv(){
  var head=["Ticket ID","Raised on","Age (days)","Age bracket","Closed on","Store name","Store city","Issue type","Priority",
            "Summary","Details","Raised by","Mobile","Email","Assignee","Due date","Status","Last update",
            "Vendors","Invoice numbers","Invoice count","Total cost (INR)","Payment status","Completion photos","Issue attachments","Video link"];
  var q=function(s){ return '"'+String(s==null?"":s).replace(/"/g,'""').replace(/\r?\n/g," ")+'"'; };
  var rows=filtered().map(function(t){
    var inv=t.invoices||[];
    return [t.id,String(t.created).slice(0,10),ageDays(t),ageBucket(ageDays(t)).label,String(t.closedAt||"").slice(0,10),
      t.store,t.city,t.category,t.priority||UNRATED,t.title,t.description,
      (t.reporter&&t.reporter.name)||"",(t.reporter&&t.reporter.phone)||"",(t.reporter&&t.reporter.email)||"",
      t.assignee||"",t.due||"",t.status,lastNote(t),
      inv.map(function(i){return i.vendor;}).filter(Boolean).join(" | "),
      inv.map(function(i){return i.no;}).filter(Boolean).join(" | "),
      inv.length, ticketCost(t) || 0,
      uniq(inv.map(function(i){return i.status||"Pending approval";})).join(" | "),
      (t.completion||[]).length,(t.media||[]).length,t.videoLink||""].map(q).join(",");
  });
  return head.map(q).join(",")+"\r\n"+rows.join("\r\n");
}
function exportCSV(){
  var text="﻿"+csv();
  try{
    var blob=new Blob([text],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="frido-maintenance-"+todayISO()+".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast("Exported.");
  }catch(e){ toast("Export failed in this browser."); }
}

function setBusy(on,btnId,label){
  busy=on;
  if(btnId){ var b=document.getElementById(btnId); if(b){ b.disabled=on; if(label) b.textContent=label; } }
}

/* ============ wiring ============ */
function wire(){
  var f=document.getElementById("ticketform");
  if(f) f.addEventListener("submit",submitTicket);

  var drop=document.getElementById("drop"), fin=document.getElementById("filein");
  if(drop&&fin){
    drop.addEventListener("click",function(){ fin.click(); });
    drop.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fin.click(); } });
    drop.addEventListener("dragover",function(e){ e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave",function(){ drop.classList.remove("over"); });
    drop.addEventListener("drop",function(e){ e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); });
    fin.addEventListener("change",function(){ addFiles(fin.files); fin.value=""; });
    paintThumbs();
  }

  ["f-q","f-city","f-store","f-cat","f-pri","f-st","f-asg"].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    var key=id.slice(2);
    var handler=function(){
      filters[key==="q"?"q":key]=el.value;
      var pos = (id==="f-q") ? el.selectionStart : null;
      render();
      if(id==="f-q"){ var n=document.getElementById("f-q"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
    };
    el.addEventListener(id==="f-q"?"input":"change", debounce(handler, id==="f-q"?260:0));
  });

  var ts=document.getElementById("trackstore");
  if(ts) ts.addEventListener("change",function(){ trackStore=ts.value; render(); });

  var pin=document.getElementById("pinin");
  if(pin) pin.addEventListener("keydown",function(e){ if(e.key==="Enter") tryUnlock(); });
}
function debounce(fn,ms){ if(!ms) return fn; var t; return function(){ clearTimeout(t); t=setTimeout(fn,ms); }; }

function tryUnlock(){
  var el=document.getElementById("pinin"); if(!el) return;
  if(el.value.trim()===String(S.pin||"")){ UNLOCKED=true; render(); }
  else { var e=document.getElementById("pinerr"); if(e){ e.textContent="That passcode doesn't match."; e.style.color="var(--crit)"; } }
}

document.addEventListener("click",function(e){
  if(!e.target || !e.target.closest) return;
  var kill=e.target.closest("[data-kill]");
  if(kill){
    var i=parseInt(kill.getAttribute("data-kill"),10);
    if(i<draft.photos.length) draft.photos.splice(i,1);
    else { var vi=i-draft.photos.length; if(draft.videos[vi]){ URL.revokeObjectURL(draft.videos[vi].url); draft.videos.splice(vi,1); } }
    paintThumbs(); return;
  }
  var ck=e.target.closest("[data-ckill]");
  if(ck){ cdraft.splice(parseInt(ck.getAttribute("data-ckill"),10),1); paintCDraft(); return; }
  var ag=e.target.closest("[data-age]");
  if(ag){
    var k=ag.getAttribute("data-age");
    filters.age = (filters.age===k) ? "" : k;
    render(); return;
  }
  var t=e.target.closest("[data-view]");
  if(t){ VIEW=t.getAttribute("data-view"); closeDrawer(); window.__lastTicket=null; render(); window.scrollTo({top:0}); return; }
  var op=e.target.closest("[data-open]");
  if(op){ openDrawer(op.getAttribute("data-open")); return; }
  var a=e.target.closest("[data-act]");
  if(!a) return;
  var act=a.getAttribute("data-act");
  if(act==="close-drawer"){ closeDrawer(); }
  else if(act==="unlock"){ tryUnlock(); }
  else if(act==="new-ticket"){ window.__lastTicket=null; render(); }
  else if(act==="go-track"){ window.__lastTicket=null; VIEW="track"; render(); }
  else if(act==="reset"){ draft={photos:[],videos:[]}; clearDraft(); window.__lastTicket=null; render(); }
  else if(act==="toggle-late"){ filters.late=!filters.late; render(); }
  else if(act==="export"){ exportCSV(); }
  else if(act==="settings"){ openSettings(); }
  else if(act==="save-settings"){ saveSettings(); }
  else if(act==="purge-closed"){ purgeClosed(); }
  else if(act==="save-ticket"){ saveTicket(a.getAttribute("data-id")); }
  else if(act==="strip-media"){ stripMedia(a.getAttribute("data-id")); }
  else if(act==="add-invoice"){ addInvoice(a.getAttribute("data-id")); }
  else if(act==="del-invoice"){ delInvoice(a.getAttribute("data-id"), a.getAttribute("data-inv")); }
  else if(act==="add-completion"){ addCompletion(a.getAttribute("data-id")); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeDrawer(); });
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"){ var r=e.target.closest && e.target.closest("tr[data-open]"); if(r){ e.preventDefault(); openDrawer(r.getAttribute("data-open")); } }
});

boot();
})();
</script>
